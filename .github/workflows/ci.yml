name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run lint
      - run: npm run format:check
      - name: Serve the production build
        run: |
          npm run serve -- --host 127.0.0.1 --port 5173 > /tmp/sawiyya-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/sawiyya-preview.log
          exit 1
      - run: npm run smoke
      - run: npm run verify:grading
