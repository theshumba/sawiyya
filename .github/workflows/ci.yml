name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run lint
      - run: npm run format:check
      - name: Serve the production build and run smoke checks
        run: |
          npm run serve -- --host localhost --port 5173 > /tmp/sawiyya-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:5173/ > /dev/null && break
            sleep 1
          done
          if ! curl --fail --silent http://localhost:5173/ > /dev/null; then
            cat /tmp/sawiyya-preview.log
            exit 1
          fi
          npm run smoke
      - run: npm run verify:grading
